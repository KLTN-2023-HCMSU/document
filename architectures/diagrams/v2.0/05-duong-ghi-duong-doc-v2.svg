<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#667899"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 42px Inter,Segoe UI,Arial,sans-serif; fill: #0f1f4d; }
      .subtitle { font: 400 18px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .box { fill: #ffffff; stroke: #8ea0c9; stroke-width: 2; rx: 18; ry: 18; }
      .softbox { fill: #f4f7fc; stroke: #8ea0c9; stroke-width: 2; rx: 18; ry: 18; }
      .bluebox { fill: #eaf2ff; stroke: #2f7de1; stroke-width: 2.5; rx: 18; ry: 18; }
      .purplebox { fill: #f0efff; stroke: #5966f2; stroke-width: 2.5; rx: 18; ry: 18; }
      .greenbox { fill: #ecfdf3; stroke: #22c55e; stroke-width: 2.5; rx: 18; ry: 18; }
      .orangebox { fill: #fff7e8; stroke: #f59e0b; stroke-width: 2.5; rx: 18; ry: 18; }
      .label { font: 700 18px Inter,Segoe UI,Arial,sans-serif; fill: #0f1f4d; }
      .small { font: 400 14px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .body { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .tiny { font: 400 12px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .num { font: 700 16px Inter,Segoe UI,Arial,sans-serif; fill: #0f1f4d; }
      .arrow { stroke: #667899; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #667899; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #d97706; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowOrange); }
      .section { font: 700 22px Inter,Segoe UI,Arial,sans-serif; }
      .footerbox { fill: #f8fbff; stroke: #d6deeb; stroke-width: 1.5; rx: 18; ry: 18; }
    </style>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="850" y="72" text-anchor="middle" class="title">Dữ liệu lừa đảo: đường ghi và đường đọc</text><text x="850" y="118" text-anchor="middle" class="subtitle">PostgreSQL là nguồn sự thật, Redis chỉ là bản nóng</text><text x="70" y="190" class="section" fill="#b45309">ĐƯỜNG GHI — chạy định kỳ</text><text x="70" y="225" class="body">Nạp, chuẩn hoá và cập nhật kho dữ liệu</text><rect x="50" y="270" width="340" height="115" class="softbox"/><text x="220.0" y="308" text-anchor="middle" class="label"><tspan x="220.0" dy="0">Nguồn bên ngoài</tspan></text><text x="220.0" y="338" text-anchor="middle" class="body"><tspan x="220.0" dy="0">feed · dataset · admin nạp</tspan></text><rect x="490" y="270" width="370" height="115" class="orangebox"/><text x="675.0" y="308" text-anchor="middle" class="label"><tspan x="675.0" dy="0">Worker nạp dữ liệu</tspan></text><text x="675.0" y="338" text-anchor="middle" class="body"><tspan x="675.0" dy="0">chuẩn hoá · khử trùng lặp · gắn nguồn</tspan></text><rect x="950" y="270" width="280" height="115" class="softbox"/><text x="1090.0" y="308" text-anchor="middle" class="label"><tspan x="1090.0" dy="0">PostgreSQL</tspan></text><text x="1090.0" y="338" text-anchor="middle" class="body"><tspan x="1090.0" dy="0">nguồn sự thật</tspan></text><rect x="1370" y="270" width="240" height="115" class="softbox"/><text x="1490.0" y="308" text-anchor="middle" class="label"><tspan x="1490.0" dy="0">Redis</tspan></text><text x="1490.0" y="338" text-anchor="middle" class="body"><tspan x="1490.0" dy="0">bản nóng</tspan></text><path d="M390 327 L490 327" class="arrow"/><path d="M860 327 L950 327" class="arrow"/><path d="M1230 327 L1370 327" class="arrow"/><text x="1300" y="305" text-anchor="middle" class="small">làm mới cache</text><line x1="40" y1="470" x2="1620" y2="470" stroke="#d6deeb" stroke-width="2"/><text x="70" y="555" class="section" fill="#0f69b4">ĐƯỜNG ĐỌC — chỉ lõi được đọc</text><text x="70" y="590" class="body">Tra cứu dữ liệu uy tín để chấm điểm</text><rect x="45" y="635" width="310" height="115" class="bluebox"/><text x="200.0" y="673" text-anchor="middle" class="label"><tspan x="200.0" dy="0">Điều phối scan</tspan></text><text x="200.0" y="703" text-anchor="middle" class="body"><tspan x="200.0" dy="0">cần dữ liệu cho một chỉ dấu</tspan></text><rect x="420" y="635" width="340" height="115" class="purplebox"/><text x="590.0" y="673" text-anchor="middle" class="label"><tspan x="590.0" dy="0">Module tra cứu uy tín</tspan></text><text x="590.0" y="703" text-anchor="middle" class="body"><tspan x="590.0" dy="0">nơi duy nhất chạm vào dữ liệu</tspan></text><rect x="820" y="635" width="260" height="115" class="softbox"/><text x="950.0" y="673" text-anchor="middle" class="label"><tspan x="950.0" dy="0">Redis trước</tspan></text><text x="950.0" y="703" text-anchor="middle" class="body"><tspan x="950.0" dy="0">trượt thì đọc PostgreSQL</tspan></text><rect x="1140" y="635" width="220" height="115" class="greenbox"/><text x="1250.0" y="673" text-anchor="middle" class="label"><tspan x="1250.0" dy="0">Kèm vào job</tspan></text><text x="1250.0" y="703" text-anchor="middle" class="body"><tspan x="1250.0" dy="0">giao cho worker</tspan></text><rect x="1410" y="635" width="220" height="115" class="softbox"/><text x="1520.0" y="673" text-anchor="middle" class="label"><tspan x="1520.0" dy="0">RabbitMQ / worker</tspan></text><text x="1520.0" y="703" text-anchor="middle" class="body"><tspan x="1520.0" dy="0">job đã kèm dữ liệu</tspan></text><path d="M355 692 L420 692" class="arrow"/><path d="M760 692 L820 692" class="arrow"/><path d="M1080 692 L1140 692" class="arrow"/><path d="M1360 692 L1410 692" class="arrow"/><rect x="170" y="790" width="1360" height="100" class="footerbox"/><circle cx="200" cy="825" r="18" fill="#e8effa" stroke="#d6deeb"/><text x="200" y="831" text-anchor="middle" class="num">1</text><text x="240" y="830" class="body">Worker không đọc PostgreSQL/Redis và không gọi ngược lõi. Chỉ dấu phát hiện giữa chừng được trả về để lõi tra hộ.</text><line x1="190" y1="850" x2="1490" y2="850" stroke="#d6deeb" stroke-dasharray="6 6"/><circle cx="200" cy="872" r="18" fill="#e8effa" stroke="#d6deeb"/><text x="200" y="878" text-anchor="middle" class="num">2</text><text x="240" y="877" class="body">Báo cáo cộng đồng chỉ trở thành dữ liệu uy tín sau khi admin duyệt — không bao giờ tự động vào blacklist.</text></svg>