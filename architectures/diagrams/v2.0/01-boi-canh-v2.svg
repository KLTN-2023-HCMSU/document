<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#667899"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 42px Inter,Segoe UI,Arial,sans-serif; fill: #0f1f4d; }
      .subtitle { font: 400 18px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .box { fill: #ffffff; stroke: #8ea0c9; stroke-width: 2; rx: 18; ry: 18; }
      .softbox { fill: #f4f7fc; stroke: #8ea0c9; stroke-width: 2; rx: 18; ry: 18; }
      .bluebox { fill: #eaf2ff; stroke: #2f7de1; stroke-width: 2.5; rx: 18; ry: 18; }
      .purplebox { fill: #f0efff; stroke: #5966f2; stroke-width: 2.5; rx: 18; ry: 18; }
      .greenbox { fill: #ecfdf3; stroke: #22c55e; stroke-width: 2.5; rx: 18; ry: 18; }
      .orangebox { fill: #fff7e8; stroke: #f59e0b; stroke-width: 2.5; rx: 18; ry: 18; }
      .label { font: 700 18px Inter,Segoe UI,Arial,sans-serif; fill: #0f1f4d; }
      .small { font: 400 14px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .body { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .tiny { font: 400 12px Inter,Segoe UI,Arial,sans-serif; fill: #6b7b9c; }
      .num { font: 700 16px Inter,Segoe UI,Arial,sans-serif; fill: #0f1f4d; }
      .arrow { stroke: #667899; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #667899; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #d97706; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowOrange); }
      .section { font: 700 22px Inter,Segoe UI,Arial,sans-serif; }
      .footerbox { fill: #f8fbff; stroke: #d6deeb; stroke-width: 1.5; rx: 18; ry: 18; }
    </style>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="800" y="78" text-anchor="middle" class="title">Bối cảnh hệ thống</text><text x="800" y="126" text-anchor="middle" class="subtitle">Ai dùng hệ thống, và hệ thống trao đổi với bên ngoài những gì</text><rect x="40" y="250" width="320" height="130" class="bluebox"/><text x="200.0" y="288" text-anchor="middle" class="label"><tspan x="200.0" dy="0">Người dùng</tspan></text><text x="200.0" y="318" text-anchor="middle" class="body"><tspan x="200.0" dy="0">Cá nhân kiểm tra nội dung</tspan><tspan x="200.0" dy="26">nghi ngờ lừa đảo</tspan></text><rect x="40" y="500" width="320" height="130" class="bluebox"/><text x="200.0" y="538" text-anchor="middle" class="label"><tspan x="200.0" dy="0">Quản trị viên</tspan></text><text x="200.0" y="568" text-anchor="middle" class="body"><tspan x="200.0" dy="0">Vận hành, duyệt báo cáo</tspan><tspan x="200.0" dy="26">và quản lý hệ thống</tspan></text><rect x="600" y="220" width="400" height="300" class="purplebox"/><text x="800.0" y="258" text-anchor="middle" class="label"><tspan x="800.0" dy="0">Anti-Scam Platform</tspan></text><text x="800.0" y="288" text-anchor="middle" class="body"><tspan x="800.0" dy="0">Kiểm tra dấu hiệu lừa đảo</tspan><tspan x="800.0" dy="26">và trả về cảnh báo</tspan></text><rect x="600" y="220" width="400" height="300" class="purplebox"/><text x="800" y="374" text-anchor="middle" style="font:700 34px Inter,Segoe UI,Arial,sans-serif; fill:#0f1f4d;">Anti-Scam Platform</text><text x="800" y="430" text-anchor="middle" class="body"><tspan x="800" dy="0">Kiểm tra dấu hiệu lừa đảo</tspan><tspan x="800" dy="26">và trả về cảnh báo</tspan></text><rect x="1180" y="180" width="360" height="150" class="softbox"/><text x="1360.0" y="218" text-anchor="middle" class="label"><tspan x="1360.0" dy="0">Nguồn dữ liệu lừa đảo</tspan></text><text x="1360.0" y="248" text-anchor="middle" class="body"><tspan x="1360.0" dy="0">Blacklist, reputation, dataset</tspan><tspan x="1360.0" dy="26">từ các nguồn bên ngoài</tspan></text><rect x="1180" y="390" width="360" height="150" class="softbox"/><text x="1360.0" y="428" text-anchor="middle" class="label"><tspan x="1360.0" dy="0">External Identity Provider</tspan></text><text x="1360.0" y="458" text-anchor="middle" class="body"><tspan x="1360.0" dy="0">Google OIDC / provider</tspan><tspan x="1360.0" dy="26">tương lai</tspan></text><rect x="1180" y="600" width="360" height="150" class="softbox"/><text x="1360.0" y="638" text-anchor="middle" class="label"><tspan x="1360.0" dy="0">Notification Channels /</tspan><tspan x="1360.0" dy="26">Providers</tspan></text><text x="1360.0" y="668" text-anchor="middle" class="body"><tspan x="1360.0" dy="0">Email / Push / SMS /</tspan><tspan x="1360.0" dy="26">Telegram / ...</tspan></text><path d="M360 315 L595 370" class="arrow"/><text x="470" y="272" text-anchor="middle" class="body"><tspan x="470" dy="0">gửi nội dung cần kiểm tra,</tspan><tspan x="470" dy="26">xem kết quả, xem lịch sử scan</tspan></text><path d="M360 565 L595 500" class="arrow"/><text x="500" y="585" text-anchor="middle" class="body"><tspan x="500" dy="0">duyệt báo cáo,</tspan><tspan x="500" dy="26">quản lý luật, xem audit</tspan></text><path d="M1180 250 L1005 300" class="arrow"/><text x="1090" y="250" text-anchor="middle" class="body"><tspan x="1090" dy="0">blacklist, reputation,</tspan><tspan x="1090" dy="26">dataset</tspan></text><path d="M1005 465 L1175 465" class="arrow2"/><path d="M1180 465 L1010 465" class="arrow2"/><text x="1092" y="440" text-anchor="middle" class="body">OAuth 2.0 / OIDC</text><path d="M1000 520 L1175 650" class="arrow"/><text x="1090" y="595" text-anchor="middle" class="body"><tspan x="1090" dy="0">OTP, cảnh báo,</tspan><tspan x="1090" dy="26">thông báo</tspan></text><rect x="36" y="800" width="1528" height="80" class="footerbox"/><line x1="805" y1="815" x2="805" y2="865" stroke="#d6deeb" stroke-width="1.5"/><text x="215" y="838" text-anchor="start" class="body"><tspan x="215" dy="0">Đầu vào:  link · tin nhắn · bài đăng · SDT · số tài khoản · QR ·</tspan><tspan x="215" dy="28">báo cáo cộng đồng</tspan></text><text x="1025" y="838" text-anchor="start" class="body"><tspan x="1025" dy="0">Đầu ra:  điểm rủi ro 0–100 · SAFE / CAUTION / DANGER ·</tspan><tspan x="1025" dy="28">bằng chứng · giải thích · khuyến nghị</tspan></text></svg>