<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="440" fill="#ffffff"/>
  <text x="550" y="46" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Dữ liệu lừa đảo: đường ghi và đường đọc</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#64748b">PostgreSQL là nguồn sự thật, Redis chỉ là bản nóng</text>

  <text x="60" y="126" font-size="13" font-weight="600" fill="#b45309">ĐƯỜNG GHI — chạy định kỳ</text>

  <rect x="60" y="140" width="210" height="62" rx="8" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="165" y="166" text-anchor="middle" font-size="13.5" fill="#0f172a">Nguồn bên ngoài</text>
  <text x="165" y="185" text-anchor="middle" font-size="11.5" fill="#64748b">feed · dataset · admin nạp</text>

  <rect x="330" y="140" width="260" height="62" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="166" text-anchor="middle" font-size="13.5" fill="#0f172a">Worker nạp dữ liệu</text>
  <text x="460" y="185" text-anchor="middle" font-size="11.5" fill="#64748b">chuẩn hoá · khử trùng lặp · gắn nguồn</text>

  <rect x="650" y="140" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="750" y="166" text-anchor="middle" font-size="13.5" fill="#0f172a">PostgreSQL</text>
  <text x="750" y="185" text-anchor="middle" font-size="11.5" fill="#64748b">nguồn sự thật</text>

  <rect x="900" y="140" width="140" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="970" y="166" text-anchor="middle" font-size="13.5" fill="#0f172a">Redis</text>
  <text x="970" y="185" text-anchor="middle" font-size="11.5" fill="#64748b">bản nóng</text>

  <line x1="272" y1="171" x2="326" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="592" y1="171" x2="646" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="852" y1="171" x2="896" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="874" y="222" text-anchor="middle" font-size="11" fill="#475569">làm mới cache</text>

  <line x1="60" y1="256" x2="1040" y2="256" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="60" y="292" font-size="13" font-weight="600" fill="#0369a1">ĐƯỜNG ĐỌC — chỉ lõi được đọc</text>

  <rect x="60" y="306" width="210" height="62" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="165" y="332" text-anchor="middle" font-size="13.5" fill="#0f172a">Điều phối scan</text>
  <text x="165" y="351" text-anchor="middle" font-size="11.5" fill="#64748b">cần dữ liệu cho một chỉ dấu</text>

  <rect x="330" y="306" width="260" height="62" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="460" y="332" text-anchor="middle" font-size="13.5" fill="#0f172a">Module tra cứu uy tín</text>
  <text x="460" y="351" text-anchor="middle" font-size="11.5" fill="#64748b">nơi duy nhất chạm vào dữ liệu</text>

  <rect x="650" y="306" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="750" y="332" text-anchor="middle" font-size="13.5" fill="#0f172a">Redis trước</text>
  <text x="750" y="351" text-anchor="middle" font-size="11.5" fill="#64748b">trượt thì đọc PostgreSQL</text>

  <rect x="900" y="306" width="140" height="62" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="970" y="332" text-anchor="middle" font-size="13.5" fill="#0f172a">Kèm vào job</text>
  <text x="970" y="351" text-anchor="middle" font-size="11.5" fill="#64748b">giao cho worker</text>

  <line x1="272" y1="337" x2="326" y2="337" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="592" y1="337" x2="646" y2="337" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="852" y1="337" x2="896" y2="337" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="550" y="390" text-anchor="middle" font-size="12" fill="#64748b">Worker không đọc PostgreSQL/Redis và không gọi ngược lõi. Chỉ dấu phát hiện giữa chừng được trả về để lõi tra hộ.</text>
  <text x="550" y="412" text-anchor="middle" font-size="12" fill="#64748b">Báo cáo cộng đồng chỉ trở thành dữ liệu uy tín sau khi admin duyệt — không bao giờ tự động vào blacklist.</text>
</svg>
