  <line x1="212" y1="258" x2="366" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="289" y="276" text-anchor="middle" font-size="11" fill="#475569">duyệt báo cáo,</text>
