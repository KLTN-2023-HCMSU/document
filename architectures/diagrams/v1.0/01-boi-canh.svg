  <text x="840" y="272" text-anchor="middle" font-size="14" fill="#0f172a">(tuỳ chọn)</text>

  <line x1="212" y1="150" x2="366" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
