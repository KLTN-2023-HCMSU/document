  <text x="480" y="352" text-anchor="middle" font-size="12" fill="#64748b">Đầu vào: link · tin nhắn · bài đăng · SĐT · số tài khoản · CCCD · QR · báo cáo cộng đồng</text>
  <text x="480" y="372" text-anchor="middle" font-size="12" fill="#64748b">Đầu ra: điểm rủi ro 0–100 · mức SAFE / CAUTION / DANGER · bằng chứng · giải thích · khuyến nghị</text>
