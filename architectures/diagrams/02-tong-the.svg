<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#64748b"/>
    </marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="1440" height="1120" fill="#ffffff"/>

  <text x="720" y="48" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">Kiến trúc tổng thể</text>
  <text x="720" y="76" text-anchor="middle" font-size="14" fill="#64748b">Một lõi nghiệp vụ ra quyết định · các worker chạy nền qua hàng đợi</text>

  <!-- ===== CLIENTS ===== -->
  <rect x="70" y="112" width="290" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="215" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Web người dùng</text>
  <text x="215" y="160" text-anchor="middle" font-size="11.5" fill="#64748b">Next.js</text>

  <rect x="385" y="112" width="290" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Mobile</text>
  <text x="530" y="160" text-anchor="middle" font-size="11.5" fill="#64748b">React Native</text>

  <rect x="700" y="112" width="290" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="845" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Admin Dashboard</text>
  <text x="845" y="160" text-anchor="middle" font-size="11.5" fill="#64748b">Next.js</text>

  <line x1="215" y1="178" x2="430" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="178" x2="530" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="845" y1="178" x2="630" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== NGINX ===== -->
  <rect x="330" y="215" width="400" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Nginx</text>
  <text x="530" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">HTTPS · TLS · reverse proxy · chặn flood theo IP</text>

  <line x1="530" y1="275" x2="530" y2="296" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="545" y="291" font-size="11" fill="#475569">REST API</text>

  <!-- ===== SPRING BOOT ===== -->
  <rect x="70" y="300" width="920" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="530" y="330" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Spring Boot — lõi nghiệp vụ</text>

  <rect x="90" y="348" width="280" height="62" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="230" y="373" text-anchor="middle" font-size="13.5" fill="#1e293b">Xác thực &amp; API</text>
  <text x="230" y="393" text-anchor="middle" font-size="11" fill="#64748b">kiểm tra · phân loại đầu vào</text>

  <rect x="390" y="348" width="280" height="62" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="530" y="373" text-anchor="middle" font-size="13.5" fill="#1e293b">Điều phối scan</text>
  <text x="530" y="393" text-anchor="middle" font-size="11" fill="#64748b">quét cha/con · thời hạn · trạng thái</text>

  <rect x="690" y="348" width="280" height="62" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="830" y="373" text-anchor="middle" font-size="13.5" fill="#1e293b">Luật &amp; chấm điểm rủi ro</text>
  <text x="830" y="393" text-anchor="middle" font-size="11" fill="#64748b">gộp tín hiệu → điểm · giải thích</text>

  <rect x="90" y="420" width="280" height="62" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="230" y="445" text-anchor="middle" font-size="13.5" fill="#1e293b">Tra cứu uy tín</text>
  <text x="230" y="465" text-anchor="middle" font-size="11" fill="#64748b">API nội bộ, một cửa cho mọi worker</text>

  <rect x="390" y="420" width="280" height="62" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="530" y="445" text-anchor="middle" font-size="13.5" fill="#1e293b">Lịch sử · Báo cáo cộng đồng</text>
  <text x="530" y="465" text-anchor="middle" font-size="11" fill="#64748b">tra cứu · kiểm duyệt báo cáo</text>

  <rect x="690" y="420" width="280" height="62" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="830" y="445" text-anchor="middle" font-size="13.5" fill="#1e293b">Quản trị · Thông báo · Nhật ký</text>
  <text x="830" y="465" text-anchor="middle" font-size="11" fill="#64748b">cấu hình luật · theo dõi vận hành</text>

  <!-- backend <-> storage -->
  <line x1="992" y1="390" x2="1046" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
  <text x="1019" y="378" text-anchor="middle" font-size="10.5" fill="#475569">đọc / ghi</text>

  <!-- backend <-> MQ -->
  <line x1="375" y1="492" x2="375" y2="541" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="362" y="521" text-anchor="end" font-size="11" fill="#475569">giao việc</text>
  <line x1="685" y1="541" x2="685" y2="492" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="698" y="521" font-size="11" fill="#475569">nhận kết quả</text>

  <!-- ===== RABBITMQ ===== -->
  <rect x="210" y="545" width="640" height="110" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="574" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">RabbitMQ — hàng đợi công việc</text>

  <rect x="230" y="590" width="290" height="52" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="375" y="612" text-anchor="middle" font-size="13" fill="#1e293b">Hàng đợi việc</text>
  <text x="375" y="631" text-anchor="middle" font-size="10.5" fill="#64748b">quét URL · văn bản · uy tín · QR · xuất báo cáo</text>

  <rect x="540" y="590" width="290" height="52" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="685" y="612" text-anchor="middle" font-size="13" fill="#1e293b">Hàng đợi kết quả</text>
  <text x="685" y="631" text-anchor="middle" font-size="10.5" fill="#64748b">tín hiệu phân tích · chỉ dấu tách được</text>

  <!-- MQ <-> workers -->
  <line x1="375" y1="657" x2="375" y2="696" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="388" y="681" font-size="11" fill="#475569">nhận việc</text>
  <line x1="685" y1="696" x2="685" y2="657" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="698" y="681" font-size="11" fill="#475569">trả tín hiệu / chỉ dấu</text>

  <!-- ===== WORKERS ===== -->
  <rect x="70" y="700" width="920" height="166" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="530" y="728" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Các worker chạy nền</text>

  <rect x="86" y="742" width="168" height="108" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="170" y="778" text-anchor="middle" font-size="13.5" fill="#1e293b">Quét URL</text>
  <text x="170" y="800" text-anchor="middle" font-size="11.5" fill="#64748b">&amp; nội dung web</text>
  <text x="170" y="822" text-anchor="middle" font-size="10.5" fill="#94a3b8">HTML · form · DNS · TLS</text>

  <rect x="266" y="742" width="168" height="108" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="350" y="778" text-anchor="middle" font-size="13.5" fill="#1e293b">Phân tích văn bản</text>
  <text x="350" y="800" text-anchor="middle" font-size="11.5" fill="#64748b">tin nhắn · hội thoại</text>
  <text x="350" y="822" text-anchor="middle" font-size="10.5" fill="#94a3b8">bài đăng giao dịch</text>

  <rect x="446" y="742" width="168" height="108" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="530" y="778" text-anchor="middle" font-size="13.5" fill="#1e293b">Tra cứu uy tín</text>
  <text x="530" y="800" text-anchor="middle" font-size="11.5" fill="#64748b">SĐT · STK · CCCD</text>
  <text x="530" y="822" text-anchor="middle" font-size="10.5" fill="#94a3b8">đối chiếu dữ liệu lừa đảo</text>

  <rect x="626" y="742" width="168" height="108" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="710" y="778" text-anchor="middle" font-size="13.5" fill="#1e293b">Đọc QR</text>
  <text x="710" y="800" text-anchor="middle" font-size="11.5" fill="#64748b">QR · VietQR</text>
  <text x="710" y="822" text-anchor="middle" font-size="10.5" fill="#94a3b8">tách chỉ dấu bên trong</text>

  <rect x="806" y="742" width="168" height="108" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="890" y="778" text-anchor="middle" font-size="13.5" fill="#1e293b">Xuất báo cáo</text>
  <text x="890" y="800" text-anchor="middle" font-size="11.5" fill="#64748b">PDF / HTML</text>
  <text x="890" y="822" text-anchor="middle" font-size="10.5" fill="#94a3b8">không phân tích</text>

  <!-- worker -> reputation lookup (solid, mandatory) -->
  <polyline points="68,800 44,800 44,451 86,451" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="56" y="508" font-size="11" fill="#475569">worker hỏi uy tín</text>
  <text x="56" y="524" font-size="11" fill="#475569">qua API nội bộ</text>

  <!-- export worker -> MinIO -->
  <polyline points="976,796 1025,796 1025,628 1062,628" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- workers <-> AI (dashed = optional) -->
  <line x1="170" y1="852" x2="170" y2="888" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#v)" marker-start="url(#w)"/>
  <line x1="350" y1="852" x2="350" y2="888" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#v)" marker-start="url(#w)"/>
  <text x="260" y="876" text-anchor="middle" font-size="10.5" fill="#7c3aed">gọi AI / nhận dự đoán</text>

  <!-- ===== AI ===== -->
  <rect x="70" y="890" width="430" height="96" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="285" y="923" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Dịch vụ AI/ML — Python</text>
  <text x="285" y="945" text-anchor="middle" font-size="11.5" fill="#64748b">tuỳ chọn · phục vụ worker URL và văn bản</text>
  <text x="285" y="965" text-anchor="middle" font-size="11.5" fill="#64748b">trả xác suất · nhãn · phiên bản mô hình</text>

  <!-- ===== LEGEND ===== -->
  <rect x="540" y="890" width="330" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="558" y="915" font-size="12" font-weight="600" fill="#475569">Chú giải</text>
  <line x1="558" y1="935" x2="596" y2="935" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="606" y="939" font-size="11" fill="#475569">luồng bắt buộc</text>
  <line x1="558" y1="957" x2="596" y2="957" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#v)"/>
  <text x="606" y="961" font-size="11" fill="#475569">thành phần tuỳ chọn</text>
  <text x="558" y="980" font-size="10.5" fill="#94a3b8">Worker chỉ trả tín hiệu — Spring Boot mới kết luận</text>

  <!-- ===== STORAGE ===== -->
  <rect x="1050" y="300" width="340" height="440" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1220" y="330" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Lưu trữ &amp; cache</text>

  <rect x="1070" y="345" width="300" height="96" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1220" y="379" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="1220" y="401" text-anchor="middle" font-size="11.5" fill="#64748b">nguồn sự thật</text>
  <text x="1220" y="421" text-anchor="middle" font-size="11.5" fill="#64748b">dữ liệu nghiệp vụ + dữ liệu lừa đảo</text>

  <rect x="1070" y="460" width="300" height="96" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1220" y="494" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Redis</text>
  <text x="1220" y="516" text-anchor="middle" font-size="11.5" fill="#64748b">cache uy tín · rate limit</text>
  <text x="1220" y="536" text-anchor="middle" font-size="11.5" fill="#64748b">chống gửi trùng · điều phối</text>

  <rect x="1070" y="580" width="300" height="96" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1220" y="614" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">MinIO / S3</text>
  <text x="1220" y="636" text-anchor="middle" font-size="11.5" fill="#64748b">ảnh bằng chứng · file đính kèm</text>
  <text x="1220" y="656" text-anchor="middle" font-size="11.5" fill="#64748b">báo cáo PDF / HTML</text>

  <text x="1220" y="710" text-anchor="middle" font-size="11" fill="#475569">Chỉ Spring Boot và Worker nạp dữ liệu</text>
  <text x="1220" y="726" text-anchor="middle" font-size="11" fill="#475569">được phép ghi vào ba kho này</text>

  <!-- ===== INGESTION ===== -->
  <line x1="1220" y1="808" x2="1220" y2="744" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1236" y="772" font-size="10.5" fill="#475569">ghi PostgreSQL</text>
  <text x="1236" y="788" font-size="10.5" fill="#475569">rồi làm mới Redis</text>

  <rect x="1050" y="810" width="340" height="100" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1220" y="845" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Nạp dữ liệu lừa đảo</text>
  <text x="1220" y="867" text-anchor="middle" font-size="11.5" fill="#64748b">chuẩn hoá · kiểm tra · loại trùng</text>
  <text x="1220" y="887" text-anchor="middle" font-size="11.5" fill="#64748b">chạy theo lịch, không theo request</text>

  <line x1="1220" y1="958" x2="1220" y2="914" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1236" y="940" font-size="10.5" fill="#475569">nạp / đồng bộ</text>

  <rect x="1050" y="960" width="340" height="80" rx="8" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="1220" y="993" text-anchor="middle" font-size="14" fill="#0f172a">Nguồn dữ liệu bên ngoài</text>
  <text x="1220" y="1014" text-anchor="middle" font-size="11.5" fill="#64748b">feed công khai · CSV / JSON · admin nạp</text>

  <text x="720" y="1072" text-anchor="middle" font-size="12" fill="#64748b">Kết quả cuối cùng luôn do Spring Boot tạo ra và lưu vào PostgreSQL. Không worker nào tự quyết định mức cảnh báo.</text>
</svg>
